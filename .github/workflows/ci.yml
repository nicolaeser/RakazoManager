name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: test -z "$(gofmt -l cmd internal)"

      - name: Verify shell scripts
        run: sh -n install.sh scripts/build-release.sh

      - name: Static analysis
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build -trimpath ./cmd/rakazo-manager
